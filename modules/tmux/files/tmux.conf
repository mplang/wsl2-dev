# wsl2-dev:tmux -- sourced at the top of ~/.tmux.conf, so your own settings
# below it win. Updated by modules/tmux/install.sh; edits here are lost.

# ===========================================================
# PREFIX: Ctrl-Space (easier to reach than Ctrl-B)
# ===========================================================

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ===========================================================
# TERMINAL (Windows Terminal)
# ===========================================================

set -g default-terminal 'tmux-256color'
set -sg escape-time 1            # Esc reaches vim and others immediately

# True color, italics, curly and colored underlines
set -as terminal-overrides ',xterm*:Tc:sitm=\E[3m'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Apps can tell Shift-Enter from Enter; pastes, focus and titles pass through
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title:paste'

set -g set-titles on
set -g history-limit 50000
set -g focus-events on

# ===========================================================
# MOUSE AND CLIPBOARD
# ===========================================================

set -g mouse on
# Copies go to the Windows clipboard (OSC 52; Windows Terminal supports it)
set -g set-clipboard on

# Scrolling: full-screen apps (vim, less) get the wheel; otherwise it scrolls
# back through the pane's history
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# ===========================================================
# WINDOWS AND PANES
# ===========================================================

set -g base-index 1              # number from 1, like the keyboard
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off     # closing a session's last window switches sessions
set -g monitor-activity on       # mark windows with new output...
set -g visual-activity off       # ...without a message

# Splits keep the current directory: prefix - (below), prefix | (beside)
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# Alt-Shift-H / Alt-Shift-L: previous / next window, no prefix
bind -n M-H previous-window
bind -n M-L next-window

# prefix H/J/K/L (repeatable): resize the pane
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# prefix R: reload your config (~/.tmux.conf or ~/.config/tmux/tmux.conf)
bind R run-shell 'f=~/.tmux.conf; [ -f "$f" ] || f=${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux.conf; tmux source-file "$f" && tmux display-message "Config reloaded"'

# ===========================================================
# COPY MODE: vi keys (prefix [ to enter, v select, y copy)
# ===========================================================

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ===========================================================
# STATUS BAR
# ===========================================================

# Colors (Gruvbox Dark). The theme module, or your own ~/.tmux.conf, can
# change them by setting these options.
set -g @thm_bg '#282828'
set -g @thm_fg '#ebdbb2'
set -g @thm_bg1 '#3c3836'
set -g @thm_bg2 '#504945'
set -g @thm_bg3 '#665c54'
set -g @thm_fg_dim '#a89984'
set -g @thm_fg_alt '#bdae93'
set -g @thm_accent '#fabd2f'
set -g @thm_hilite '#fb4934'
source-file -q ~/.config/wsl2-dev/theme/tmux.conf

# Arrow-shaped separators need a Nerd Font: set -g @wsl2dev-powerline on
set -g @wsl2dev-powerline off
%hidden R="#{?#{==:#{@wsl2dev-powerline},on},,}"
%hidden L="#{?#{==:#{@wsl2dev-powerline},on},,}"

set -g status-style "bg=#{@thm_bg1},fg=#{@thm_fg}"
set -g status-justify left
set -g status-left-style none
set -g status-right-style none
set -g status-left-length 80
set -g status-right-length 80
set -g message-style "bg=#{@thm_bg2},fg=#{@thm_fg}"
set -g message-command-style "bg=#{@thm_fg_alt},fg=#{@thm_bg1}"
set -g pane-border-style "fg=#{@thm_bg2}"
set -g pane-active-border-style "fg=#{@thm_fg_alt}"
setw -g window-status-style "bg=#{@thm_bg1},fg=#{@thm_fg}"
setw -g window-status-activity-style "bg=#{@thm_bg1},fg=#{@thm_fg_alt}"
setw -g window-status-bell-style "bg=#{@thm_hilite},fg=#{@thm_bg}"
setw -g window-status-separator ""

# [session] [1 window] [2 window*] ............ [12:34 26-Oct-26] [host] [mode]
set -g status-left "#[bg=#{@thm_bg3},fg=#{@thm_fg_alt}] #S #[bg=#{@thm_bg1},fg=#{@thm_bg3}]$R"
setw -g window-status-format "#[bg=#{@thm_bg2},fg=#{@thm_bg1}]$R#[fg=#{@thm_fg}] #I  #W #[bg=#{@thm_bg1},fg=#{@thm_bg2}]$R"
setw -g window-status-current-format "#[bg=#{@thm_accent},fg=#{@thm_bg1}]$R#[fg=#{@thm_bg2}] #I #[bold]#W#{?window_zoomed_flag,*Z,} #[bg=#{@thm_bg1},fg=#{@thm_accent},nobold]$R"
set -g status-right "#{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] ,}#[fg=#{@thm_bg2}]$L#[bg=#{@thm_bg2},fg=#{@thm_fg_dim}] %H:%M %d-%b-%y #[fg=#{@thm_fg_alt}]$L#[bg=#{@thm_fg_alt},fg=#{@thm_bg1}] #h #{tmux_mode_indicator}"

# ===========================================================
# PLUGINS (installed by TPM; the wsl2-dev:tmux-plugins block at the end of
# ~/.tmux.conf starts it). Add your own with set -g @plugin in ~/.tmux.conf.
# ===========================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'      # sensible defaults
set -g @plugin 'MunifTanjim/tmux-mode-indicator' # PREFIX / COPY / SYNC in the status bar
set -g @plugin 'laktak/extrakto'                 # prefix Tab: pick text on screen with fzf
set -g @extrakto_grab_area 'recent'

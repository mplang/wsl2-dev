# wsl2-dev:tmux -- sourced at the end of ~/.tmux.conf: starts TPM, which
# loads every set -g @plugin above it. Installs TPM and the plugins the
# first time.

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
